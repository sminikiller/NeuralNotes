name: NeuralNotes verification
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      scope:
        description: Verification to run
        type: choice
        options: [full, playground, focused, ui, native, delivery, archive, testflight]
        default: full
      verified_sha:
        description: Commit already built and packaged (required for ui/native/archive/testflight follow-up; app sources must match)
        type: string
        required: false
      apple_xcode:
        description: Compiler for native/UI follow-up (delivery always uses 26.6)
        type: choice
        options: ['16.4', '26.6']
        default: '16.4'
      ui_test:
        description: Optional comma-separated Class/testMethod filters for UI-only or focused verification
        type: string
        required: false
      native_test:
        description: Comma-separated Class/testMethod filters (required for native follow-up)
        type: string
        required: false
      playground_launch:
        description: Install and launch the app built from the actual ZIP on an iPad simulator
        type: boolean
        default: false
      playground_xcode:
        description: Compiler/SDK for the App Playground package
        type: choice
        options: ['26.6', '16.4', '15.4']
        default: '16.4'
      playground_configuration:
        description: Build configuration for the App Playground package
        type: choice
        options: [Debug, Release]
        default: Debug
      delivery_upload:
        description: Sign and upload to TestFlight (requires production acceptance and distribution secrets; scope testflight uploads an internal beta without them)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: neuralnotes-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  portable:
    if: inputs.scope != 'playground'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Install Swift grammar parser
        run: python -m pip install --target .verification/python-tooling tree-sitter==0.26.0 tree-sitter-swift==0.7.4
      - name: Check project and Swift grammar
        run: python tools/check_project.py --swift-syntax
      - name: Backend unit tests (no provider calls)
        run: node --test backend/*.test.mjs
      - name: Distribution preflight regression checks
        run: python -m unittest discover -s tools -p test_release_readiness.py
      - name: Verify iPad package
        run: python tools/package_ipad.py
  backend-services:
    if: inputs.scope != 'playground' && inputs.scope != 'focused' && inputs.scope != 'ui' && inputs.scope != 'native' && inputs.scope != 'archive' && inputs.scope != 'testflight'
    needs: portable
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: PostgreSQL security and account lifecycle
        shell: pwsh
        run: ./backend/platform/verify.ps1
      - name: Real local email Auth, private Storage and gateway integration (AI provider simulated)
        run: node backend/integration/run.mjs
  upgrade:
    if: inputs.scope != 'playground' && inputs.scope != 'focused' && inputs.scope != 'ui' && inputs.scope != 'native' && inputs.scope != 'archive' && inputs.scope != 'testflight'
    needs: portable
    runs-on: ${{ inputs.scope == 'delivery' && 'macos-26' || 'macos-15' }}
    env:
      DEVELOPER_DIR: /Applications/Xcode_${{ inputs.scope == 'delivery' && '26.6' || '16.4' }}.app/Contents/Developer
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Replace previous binary and verify persisted notebook
        shell: bash
        run: |
          set -o pipefail
          mkdir -p .verification
          bash tools/verify_upgrade_macos.sh 2>&1 | tee .verification/upgrade-validation.log
      - name: Preserve upgrade evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: upgrade-validation-${{ github.run_id }}
          retention-days: 3
          include-hidden-files: true
          path: |
            .verification/upgrade-validation.log
            .verification/upgrade/before.json
            .verification/upgrade/after.json
  apple:
    if: inputs.scope != 'playground' && inputs.scope != 'archive' && inputs.scope != 'testflight'
    needs: portable
    runs-on: ${{ (inputs.scope == 'delivery' || inputs.apple_xcode == '26.6') && 'macos-26' || 'macos-15' }}
    env:
      DEVELOPER_DIR: /Applications/Xcode_${{ (inputs.scope == 'delivery' || inputs.apple_xcode == '26.6') && '26.6' || '16.4' }}.app/Contents/Developer
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Require unchanged application for UI-only follow-up
        if: inputs.scope == 'ui' || inputs.scope == 'native'
        env:
          VERIFIED_APP_SHA: ${{ inputs.verified_sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$VERIFIED_APP_SHA" =~ ^[0-9a-f]{40}$ ]]
          git fetch --depth=1 origin "$VERIFIED_APP_SHA"
          git diff --exit-code FETCH_HEAD HEAD -- NeuralNotes NeuralNotes.xcodeproj Package.swift Package.resolved tools/package_ipad.py tools/generate_project.py
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Build, run Swift tests and iPad UI tests
        env:
          NEURALNOTES_FOCUSED_TESTS: ${{ inputs.scope == 'focused' && '1' || '0' }}
          NEURALNOTES_UI_ONLY: ${{ inputs.scope == 'ui' && '1' || '0' }}
          NEURALNOTES_UI_TEST: ${{ inputs.ui_test }}
          NEURALNOTES_NATIVE_ONLY: ${{ inputs.scope == 'native' && '1' || '0' }}
          NEURALNOTES_NATIVE_TEST: ${{ inputs.native_test }}
        shell: bash
        run: |
          set -o pipefail
          mkdir -p .verification
          bash tools/verify_macos.sh 2>&1 | tee .verification/apple-validation.log
      - name: Preserve Apple logs and test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apple-validation-${{ github.run_id }}
          retention-days: 14
          include-hidden-files: true
          if-no-files-found: warn
          path: |
            .verification/apple-validation.log
            .verification/**/*.xcresult
            .verification/**/screenshots/
  playground:
    if: inputs.scope != 'ui' && inputs.scope != 'native' && inputs.scope != 'archive' && inputs.scope != 'testflight'
    runs-on: ${{ inputs.scope == 'delivery' && 'macos-26' || inputs.playground_xcode == '26.6' && 'macos-26' || inputs.playground_xcode == '15.4' && 'macos-14' || 'macos-15' }}
    env:
      DEVELOPER_DIR: /Applications/Xcode_${{ inputs.scope == 'delivery' && '26.6' || inputs.playground_xcode || '16.4' }}.app/Contents/Developer
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Build the delivered App Playground package
        env:
          NEURALNOTES_PLAYGROUND_SMOKE: ${{ (inputs.scope == 'delivery' || inputs.playground_launch) && '1' || '0' }}
          NEURALNOTES_PLAYGROUND_CONFIGURATION: ${{ inputs.scope == 'delivery' && 'Release' || inputs.playground_configuration || 'Debug' }}
        shell: bash
        run: |
          set -o pipefail
          mkdir -p .verification
          bash tools/verify_playground_macos.sh 2>&1 | tee .verification/playground-validation.log
      - name: Preserve App Playground evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playground-validation-${{ github.run_id }}
          retention-days: 3
          include-hidden-files: true
          if-no-files-found: warn
          path: |
            .verification/playground-validation.log
            .verification/playground-schemes.json
            .verification/playground-launch/
            .verification/NeuralNotes-iPad-*.zip
  distribution:
    if: >-
      always() && needs.portable.result == 'success' &&
      ((inputs.scope == 'archive' && !inputs.delivery_upload) || inputs.scope == 'testflight' ||
       (inputs.scope == 'delivery' && needs.backend-services.result == 'success' &&
        needs.upgrade.result == 'success' && needs.apple.result == 'success' && needs.playground.result == 'success'))
    needs: [portable, backend-services, upgrade, apple, playground]
    runs-on: macos-26
    timeout-minutes: 25
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Require unchanged verified application for an archive-only or TestFlight follow-up
        if: inputs.scope == 'archive' || inputs.scope == 'testflight'
        env:
          VERIFIED_APP_SHA: ${{ inputs.verified_sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$VERIFIED_APP_SHA" =~ ^[0-9a-f]{40}$ ]]
          git fetch --depth=1 origin "$VERIFIED_APP_SHA"
          git diff --exit-code FETCH_HEAD HEAD -- NeuralNotes NeuralNotes.xcodeproj Package.swift Package.resolved tools/package_ipad.py tools/generate_project.py
      - name: Validate the production configuration before a requested upload
        if: inputs.delivery_upload && inputs.scope != 'testflight'
        env:
          NN_PRODUCTION_CONFIG: ${{ vars.NN_PRODUCTION_CONFIG }}
        run: python3 tools/release_readiness.py --production --online
      # Internal TestFlight beta: the physical acceptance happens on this build, so it
      # cannot be a precondition. Only signing secrets and app metadata are required.
      - name: Validate the internal TestFlight beta before signing
        if: inputs.scope == 'testflight'
        env:
          NN_CERTIFICATE_P12_BASE64: ${{ secrets.NN_CERTIFICATE_P12_BASE64 }}
          NN_CERTIFICATE_PASSWORD: ${{ secrets.NN_CERTIFICATE_PASSWORD }}
          NN_PROFILE_BASE64: ${{ secrets.NN_PROFILE_BASE64 }}
          NN_ASC_KEY_BASE64: ${{ secrets.NN_ASC_KEY_BASE64 }}
          NN_ASC_KEY_ID: ${{ secrets.NN_ASC_KEY_ID }}
          NN_ASC_ISSUER_ID: ${{ secrets.NN_ASC_ISSUER_ID }}
        run: python3 tools/release_readiness.py --beta
      - name: Archive for distribution, or sign and upload when explicitly requested
        env:
          NN_DELIVERY_UPLOAD: ${{ (inputs.delivery_upload || inputs.scope == 'testflight') && '1' || '0' }}
          NN_ICLOUD: ${{ inputs.scope == 'testflight' && '0' || '1' }}
          NN_RELEASE_VERSION: '1.0.0'
          NN_RELEASE_BUILD: ${{ github.run_number }}
          NN_CERTIFICATE_P12_BASE64: ${{ secrets.NN_CERTIFICATE_P12_BASE64 }}
          NN_CERTIFICATE_PASSWORD: ${{ secrets.NN_CERTIFICATE_PASSWORD }}
          NN_PROFILE_BASE64: ${{ secrets.NN_PROFILE_BASE64 }}
          NN_ASC_KEY_BASE64: ${{ secrets.NN_ASC_KEY_BASE64 }}
          NN_ASC_KEY_ID: ${{ secrets.NN_ASC_KEY_ID }}
          NN_ASC_ISSUER_ID: ${{ secrets.NN_ASC_ISSUER_ID }}
        shell: bash
        run: |
          set -o pipefail
          mkdir -p .verification/distribution
          bash tools/distribute_macos.sh 2>&1 | tee .verification/distribution/build.log
      - name: Preserve distribution evidence (never certificates or private keys)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: distribution-${{ github.run_id }}
          retention-days: 14
          include-hidden-files: true
          path: |
            .verification/distribution/build.log
            .verification/distribution/archive-proof.json
