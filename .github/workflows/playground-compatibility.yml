name: App Playground older compiler compatibility
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: playground-compatibility-${{ github.ref }}
  cancel-in-progress: true
jobs:
  swift-5-10:
    runs-on: macos-14
    timeout-minutes: 25
    env:
      DEVELOPER_DIR: /Applications/Xcode_15.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Build the actual package with Swift 5.10 and iOS 17.5 SDK
        shell: bash
        run: |
          set -o pipefail
          mkdir -p .verification
          bash tools/verify_playground_macos.sh 2>&1 | tee .verification/playground-compatibility.log
      - name: Preserve compiler evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playground-compatibility-${{ github.run_id }}
          retention-days: 7
          include-hidden-files: true
          path: |
            .verification/playground-compatibility.log
            .verification/playground-schemes.json
            .verification/NeuralNotes-iPad-*.zip
