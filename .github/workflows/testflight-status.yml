name: TestFlight availability status
on:
  workflow_dispatch:
    inputs:
      build:
        description: Existing TestFlight build number to inspect (no upload)
        type: string
        required: true
permissions:
  contents: read
jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - name: Read Apple processing and beta group availability
        env:
          NN_STATUS_BUILD: ${{ inputs.build }}
          NN_ASC_KEY_BASE64: ${{ secrets.NN_ASC_KEY_BASE64 }}
          NN_ASC_KEY_ID: ${{ secrets.NN_ASC_KEY_ID }}
          NN_ASC_ISSUER_ID: ${{ secrets.NN_ASC_ISSUER_ID }}
        run: node tools/testflight_status.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: testflight-status-${{ github.run_id }}
          path: .verification/testflight-status.json
          include-hidden-files: true
          retention-days: 14
