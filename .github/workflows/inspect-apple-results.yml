name: Inspect Apple test results
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Verification run containing an apple-validation artifact
        required: true
        type: string
      xcode:
        description: Match the compiler used to produce the xcresult
        type: choice
        options: ['16.4', '26.6']
        default: '16.4'
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ${{ inputs.xcode == '26.6' && 'macos-26' || 'macos-15' }}
    env:
      DEVELOPER_DIR: /Applications/Xcode_${{ inputs.xcode || '16.4' }}.app/Contents/Developer
    timeout-minutes: 10
    steps:
      - name: Download and export failed test evidence
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          set -euo pipefail
          [[ "$RUN_ID" =~ ^[0-9]+$ ]]
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name "apple-validation-$RUN_ID" --dir inspection
          bundle="$(find inspection -type d -name '*.xcresult' -print -quit)"
          test -n "$bundle"
          mkdir -p evidence
          xcrun xcresulttool get test-results summary --path "$bundle" > evidence/summary.json
          # Explicit screenshots/hierarchies added just before an assertion are
          # not always flagged isAssociatedWithFailure. Preserve them as well.
          xcrun xcresulttool export attachments --path "$bundle" --output-path evidence/attachments
          cat evidence/summary.json
      - name: Preserve readable test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apple-evidence-${{ inputs.run_id }}
          retention-days: 14
          path: evidence
          if-no-files-found: warn
